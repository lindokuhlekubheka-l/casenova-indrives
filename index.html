<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casenova InDrives - Pretoria 3D Velocity</title>
    
    <!-- PWA & Monetization Metadata -->
    <meta name="google-adsense-account" content="ca-pub-8539625352833164">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8539625352833164" crossorigin="anonymous"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">

    <!-- Tailwind CSS & Three.js Engine CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; font-family: system-ui, -apple-system, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel { background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .pulse-btn { animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- 3D WEBGL CANVAS -->
    <div id="canvas-container"></div>

    <!-- HUD OVERLAY (ACTIVE GAMEPLAY) -->
    <div id="hud" class="hidden absolute top-0 left-0 right-0 z-20 p-4 max-w-lg mx-auto flex justify-between items-start pointer-events-none">
        <!-- Speedometer & Cash -->
        <div class="glass-panel p-3 rounded-2xl flex flex-col gap-1 pointer-events-auto">
            <div class="text-xs text-zinc-400 font-bold tracking-wider uppercase">CASH EARNED</div>
            <div id="hudCash" class="text-2xl font-black text-green-400">R100,000</div>
            <div class="flex items-center gap-2 mt-1">
                <span class="text-xs text-yellow-400 font-bold">SPEED:</span>
                <span id="hudSpeed" class="text-lg font-black text-white">0 km/h</span>
            </div>
        </div>

        <!-- Camera Switcher & Status -->
        <div class="flex flex-col items-end gap-2 pointer-events-auto">
            <button onclick="switchCameraView()" class="glass-panel hover:bg-zinc-800 text-yellow-400 font-black px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 border border-yellow-400/30">
                📹 <span id="camLabel">CHASE CAM</span>
            </button>
            <div id="hudTrip" class="glass-panel px-3 py-1.5 rounded-xl text-xs font-semibold text-zinc-300">
                📍 Destination: Church Square
            </div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="game-over" class="hidden absolute inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center">
        <h1 class="text-5xl font-black text-red-500 tracking-tight mb-2">ACCIDENT DISASTER!</h1>
        <p class="text-zinc-400 text-sm mb-6">You crashed into oncoming Pretoria traffic!</p>
        <div class="glass-panel p-6 rounded-2xl border border-red-500/30 mb-6 max-w-xs w-full">
            <div class="text-xs text-zinc-400 mb-1">FINAL SCORE</div>
            <div id="finalScore" class="text-4xl font-black text-yellow-400 mb-3">0</div>
            <div class="text-xs text-zinc-400 mb-1">TOTAL TRIP PAYOUT</div>
            <div id="finalEarnings" class="text-2xl font-black text-green-400">+R0</div>
        </div>
        <button onclick="resetGame()" class="pulse-btn bg-green-500 hover:bg-green-400 text-black font-black text-lg px-8 py-3.5 rounded-2xl shadow-lg shadow-green-500/20">
            PLAY AGAIN 🔄
        </button>
    </div>

    <!-- MOBILE TOUCH CONTROLS -->
    <div id="controls" class="hidden absolute bottom-4 left-0 right-0 z-20 px-4 max-w-lg mx-auto pointer-events-none">
        <div class="grid grid-cols-2 gap-4 pointer-events-auto">
            <button id="btnLeft" class="glass-panel active:bg-yellow-400/20 py-6 rounded-2xl text-3xl font-black border border-zinc-700/50 flex justify-center items-center">
                ⬅️
            </button>
            <button id="btnRight" class="glass-panel active:bg-yellow-400/20 py-6 rounded-2xl text-3xl font-black border border-zinc-700/50 flex justify-center items-center">
                ➡️
            </button>
        </div>
    </div>

    <!-- MAIN GAME SCRIPT -->
    <script>
        // --- Game & Graphics Engine Setup ---
        let scene, camera, renderer;
        let carGroup, carBodyMesh;
        let roadChunks = [];
        let obstacles = [];
        let streetLights = [];
        let particles = [];
        
        let score = 0;
        let cash = 100000;
        let carSpeed = 0.8;
        let maxSpeed = 1.8;
        let currentLaneX = 0; // Target X coordinate (-4.5, 0, 4.5)
        let isGameOver = false;

        // Camera Modes: 0 = Third Person Chase, 1 = First Person Cockpit, 2 = Top Down Tactical
        let cameraMode = 0;
        const cameraLabels = ["CHASE CAM", "COCKPIT", "TOP-DOWN"];

        const keys = { left: false, right: false };

        function initEngine() {
            const container = document.getElementById('canvas-container');

            // 1. Scene & Environment Fog
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a10);
            scene.fog = new THREE.FogExp2(0x0a0a10, 0.012);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. WebGL Renderer with Shadows & High Resolution
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // 4. Lighting Engine
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffecd2, 1.2);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 250;
            scene.add(sunLight);

            // 5. Build Environment & Player Vehicle
            createPlayerVehicle();
            for (let i = 0; i < 5; i++) {
                spawnRoadChunk(i * -80);
            }

            // 6. Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupInputListeners();

            // 7. Start Main Loop
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            animate();
        }

        // --- Create High-Detail Vehicle ---
        function createPlayerVehicle() {
            carGroup = new THREE.Group();

            // Car Chassis
            const bodyGeo = new THREE.BoxGeometry(2.2, 1.2, 4.6);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0x2563eb, 
                roughness: 0.2, 
                metalness: 0.8 
            });
            carBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            carBodyMesh.position.y = 0.8;
            carBodyMesh.castShadow = true;
            carGroup.add(carBodyMesh);

            // Cabin Roof
            const cabinGeo = new THREE.BoxGeometry(1.9, 0.9, 2.4);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.7, -0.3);
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Headlights & Tail Lights
            const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const headlight1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), headlightMat);
            headlight1.position.set(-0.8, 0.8, -2.31);
            const headlight2 = headlight1.clone();
            headlight2.position.x = 0.8;
            carGroup.add(headlight1, headlight2);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                [-1.15, 0.45, -1.4], [1.15, 0.45, -1.4],
                [-1.15, 0.45, 1.4],  [1.15, 0.45, 1.4]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            carGroup.position.set(0, 0, 0);
            scene.add(carGroup);
        }

        // --- Procedural Road & Environment Generation ---
        function spawnRoadChunk(zPosition) {
            const chunkGroup = new THREE.Group();

            // Main Road Surface
            const roadGeo = new THREE.PlaneGeometry(16, 80);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            chunkGroup.add(road);

            // Lane Divider Markings
            const lineGeo = new THREE.PlaneGeometry(0.3, 4);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

            for (let z = -35; z < 40; z += 10) {
                const lineLeft = new THREE.Mesh(lineGeo, lineMat);
                lineLeft.rotation.x = -Math.PI / 2;
                lineLeft.position.set(-2.6, 0.02, z);

                const lineRight = lineLeft.clone();
                lineRight.position.x = 2.6;

                chunkGroup.add(lineLeft, lineRight);
            }

            // Streetlights
            const lightPoleGeo = new THREE.CylinderGeometry(0.1, 0.1, 8);
            const lightPoleMat = new THREE.MeshStandardMaterial({ color: 0x4b5563 });
            const pole = new THREE.Mesh(lightPoleGeo, lightPoleMat);
            pole.position.set(-9, 4, 0);

            const spotLight = new THREE.SpotLight(0xfff5c0, 1.5, 25, Math.PI / 4, 0.5);
            spotLight.position.set(-9, 8, 0);
            spotLight.target.position.set(-2, 0, 0);
            chunkGroup.add(pole, spotLight, spotLight.target);

            chunkGroup.position.z = zPosition;
            scene.add(chunkGroup);
            roadChunks.push(chunkGroup);
        }

        // --- Obstacle Vehicle Spawner ---
        function spawnObstacle() {
            if (isGameOver) return;

            const lanes = [-4.5, 0, 4.5];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];

            const obsGroup = new THREE.Group();
            const obsGeo = new THREE.BoxGeometry(2.1, 1.3, 4.2);
            const obsMat = new THREE.MeshStandardMaterial({ 
                color: Math.random() > 0.5 ? 0xef4444 : 0x10b981, 
                roughness: 0.3 
            });
            const obsMesh = new THREE.Mesh(obsGeo, obsMat);
            obsMesh.position.y = 0.65;
            obsMesh.castShadow = true;
            obsGroup.add(obsMesh);

            obsGroup.position.set(randomLane, 0, carGroup.position.z - 120);
            scene.add(obsGroup);
            obstacles.push(obsGroup);
        }

        setInterval(spawnObstacle, 1200);

        // --- Control Handling ---
        function setupInputListeners() {
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');

            const moveLeft = () => { if (currentLaneX > -4.5) currentLaneX -= 4.5; };
            const moveRight = () => { if (currentLaneX < 4.5) currentLaneX += 4.5; };

            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
                if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            });
        }

        function switchCameraView() {
            cameraMode = (cameraMode + 1) % 3;
            document.getElementById('camLabel').innerText = cameraLabels[cameraMode];
        }

        // --- Main Gameplay & Render Loop ---
        function animate() {
            if (!isGameOver) {
                // 1. Move Car forward & smooth lane interpolation
                carGroup.position.z -= carSpeed;
                carGroup.position.x += (currentLaneX - carGroup.position.x) * 0.15;

                // 2. Road Chunk Recycling
                roadChunks.forEach(chunk => {
                    if (chunk.position.z - carGroup.position.z > 40) {
                        chunk.position.z -= 400; // Shift far ahead
                    }
                });

                // 3. Obstacle Collision Detection & Scoring
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    
                    // Simple AABB Bounding Box Check
                    const carBox = new THREE.Box3().setFromObject(carGroup);
                    const obsBox = new THREE.Box3().setFromObject(obs);

                    if (carBox.intersectsBox(obsBox)) {
                        triggerGameOver();
                    }

                    // Recycle passed obstacles
                    if (obs.position.z > carGroup.position.z + 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score += 10;
                        cash += 150;
                        document.getElementById('hudCash').innerText = `R${cash.toLocaleString()}`;
                    }
                }

                // 4. Update HUD Speed & Score Metrics
                carSpeed = Math.min(maxSpeed, carSpeed + 0.0001);
                document.getElementById('hudSpeed').innerText = `${Math.floor(carSpeed * 120)} km/h`;

                // 5. Dynamic Camera Management
                if (cameraMode === 0) { // Chase Cam
                    camera.position.x = carGroup.position.x;
                    camera.position.y = carGroup.position.y + 5;
                    camera.position.z = carGroup.position.z + 12;
                    camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z - 10);
                } else if (cameraMode === 1) { // Cockpit Cam
                    camera.position.x = carGroup.position.x;
                    camera.position.y = carGroup.position.y + 1.6;
                    camera.position.z = carGroup.position.z - 0.2;
                    camera.lookAt(carGroup.position.x, carGroup.position.y + 1.6, carGroup.position.z - 20);
                } else { // Top Down Cam
                    camera.position.x = carGroup.position.x;
                    camera.position.y = carGroup.position.y + 35;
                    camera.position.z = carGroup.position.z - 5;
                    camera.lookAt(carGroup.position.x, 0, carGroup.position.z - 5);
                }
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalEarnings').innerText = `+R${(score * 15).toLocaleString()}`;
            document.getElementById('game-over').classList.remove('hidden');
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            carSpeed = 0.8;
            currentLaneX = 0;
            carGroup.position.set(0, 0, 0);
            isGameOver = false;

            document.getElementById('game-over').classList.add('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
